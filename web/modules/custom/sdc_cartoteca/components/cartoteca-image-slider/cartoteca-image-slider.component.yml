$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/Component/metadata.schema.json'
name: 'Cartoteca Image Slider'
status: experimental
group: sdc_cartoteca
props:
  type: object
  properties:
    url:
      type: string
      description: 'URL completa de la API Cartoteca. Vacío en estado inicial; el JS fetcha cuando se recibe el evento cartoteca:load.'
    default_image:
      type: string
      description: 'Ruta a la imagen por defecto (estado inicial o sin resultados).'
libraryOverrides:
  dependencies:
    - sdc_cartoteca/cartoteca-image-slider
