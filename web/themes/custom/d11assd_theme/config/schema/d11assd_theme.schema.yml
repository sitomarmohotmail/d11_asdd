# Schema for the configuration files of the D11assd theme (spec 001, R10).
# Drupal does not inherit the settings of the base theme, so the Bootstrap5
# settings are declared here for d11assd_theme.settings.

d11assd_theme.settings:
  type: theme_settings
  label: 'D11assd theme settings'
  mapping:
    b5_body_schema:
      type: string
      label: 'Body theme'
    b5_body_bg_schema:
      type: string
      label: 'Body background'
    b5_navbar_schema:
      type: string
      label: 'Navbar theme'
    b5_navbar_bg_schema:
      type: string
      label: 'Navbar background'
    b5_footer_schema:
      type: string
      label: 'Footer theme'
    b5_footer_bg_schema:
      type: string
      label: 'Footer background'
    b5_top_container:
      type: string
      label: 'Website container type'
    b5_top_container_config:
      type: string
      label: 'Website container classes'
    b5_theme_mode:
      type: string
      label: 'Theme mode'
    # Fields of the Bootstrap5 subtheme generator. The theme settings form
    # stores them when it is saved.
    subtheme_folder:
      type: string
      label: 'Subtheme location'
    subtheme_name:
      type: string
      label: 'Subtheme name'
    subtheme_machine_name:
      type: string
      label: 'Subtheme machine name'
